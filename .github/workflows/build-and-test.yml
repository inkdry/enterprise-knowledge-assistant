name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test .NET solution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore EnterpriseKnowledgeAssistant.slnx

      - name: Build solution
        run: >
          dotnet build EnterpriseKnowledgeAssistant.slnx
          --configuration Release
          --no-restore

      - name: Run automated tests
        run: >
          dotnet test EnterpriseKnowledgeAssistant.slnx
          --configuration Release
          --no-build
          --verbosity normal